services:
  - type: web
    name: rinko-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rinko-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_BACKEND
        value: local
      - key: EMAIL_BACKEND
        value: log
      # Once you have an S3-compatible bucket and an SMTP provider, set
      # STORAGE_BACKEND=s3 / EMAIL_BACKEND=smtp here and add the matching
      # S3_*/SMTP_* vars from .env.example — see README's Deploy section.

databases:
  - name: rinko-db
    plan: starter
    databaseName: rinko
    user: rinko
